<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Chatbot</title>

<style>
body {
    font-family: Arial, sans-serif;
}

.chat-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.chat-window {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 350px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 15px;
    display: none;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.chat-header {
    background: #2563eb;
    color: white;
    padding: 15px;
    font-weight: bold;
}

.chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
}

.message {
    margin: 10px 0;
}

.user {
    text-align: right;
    color: #2563eb;
}

.bot {
    text-align: left;
    color: #333;
}

.chat-input {
    display: flex;
    border-top: 1px solid #ddd;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border: none;
}

.chat-input button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<button class="chat-button" onclick="toggleChat()">💬</button>

<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        Website Assistant
    </div>

    <div class="chat-messages" id="messages">
        <div class="message bot">
            Hello! How can I help you today?
        </div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function toggleChat() {
    const chat = document.getElementById("chatWindow");
    chat.style.display =
        chat.style.display === "block" ? "none" : "block";
}

function botResponse(text) {
    const msg = text.toLowerCase();

    if (msg.includes("price"))
        return "Our pricing starts at $99/month.";

    if (msg.includes("contact"))
        return "You can contact us at support@example.com.";

    if (msg.includes("course"))
        return "Our course includes videos, labs, and quizzes.";

    return "Thanks for your message. A live AI chatbot could answer this dynamically.";
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    if (!input.value.trim()) return;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = input.value;
    messages.appendChild(userMsg);

    const botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.textContent = botResponse(input.value);
    messages.appendChild(botMsg);

    messages.scrollTop = messages.scrollHeight;
    input.value = "";
}
</script>

</body>
</html>
